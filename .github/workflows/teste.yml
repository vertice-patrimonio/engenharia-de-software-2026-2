name: Testes Automatizados

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  teste:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carteira-investimentos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: carteira-investimentos/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage

  auto-merge:
    needs: teste
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge automático após testes passarem
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}